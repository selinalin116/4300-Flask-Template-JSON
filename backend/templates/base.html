<!doctype html>
<title>FoodTastic</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit&family=Montserrat&family=Open+Sans:wght@500&display=swap"
    rel="stylesheet">

<body>
    <div class="full-body-container">
        <nav class="navbar">
            <h2 class="navbar-text">FoodTastic</h2>
        </nav>
        <div class="top-text">
            <div class="header-text">
                <h1>FoodTastic</h1>
                <p>Discover food and drink suggestions for your movie night!</p>
            </div>
            <div class="search-container">
                <div class="input-box" onclick="sendFocus()">
                    <img src="{{ url_for('static', filename='images/mag.png') }}" />
                    <input placeholder="Search for a movie (e.g., Star Wars, Avengers)" id="movie-search" required>
                </div>
                <div class="input-box" onclick="descriptionFocus()">
                    <input placeholder="Additional Description (e.g., Recipe that reminds me of homecook food)"
                        id="description-search">
                </div>

                <div class="submit-container">
                    <button id="search-button" onclick="searchMovie()">
                        Search Recommendations
                    </button>
                </div>
            </div>
        </div>
        <div id="loading-indicator" style="display: none;">
            <div id="loading-message">Retrieving recommendations...</div>
        </div>
        <div id="answer-box" class="answer-box">
            <!-- Results will appear here -->
        </div>
    </div>

    <script>
        function noResultsTemplate(movieTitle) {
            return `<div class='no-results'>
                <h3>No food mentions found in "${movieTitle}"</h3>
                <p>Either the movie script wasn't found or it doesn't contain any food mentions from our database.</p>
            </div>`;
        }

        function errorTemplate(message) {
            return `<div class='error-message'>
                <h3>Error</h3>
                <p>${message}</p>
            </div>`;
        }

        function sendFocus() {
            document.getElementById('movie-search').focus();
        }

        function descriptionFocus() {
            document.getElementById('description-search').focus();
        }

        function handleKeyUp(event) {
            if (event.key === "Enter") {
                searchMovie();
            }
        }
        function foodItemTemplate(foodItem) {
            return `<div class='food-item'>
            <h3 class='food-name'>${foodItem.name} <span class="food-count">(${foodItem.count} mentions)</span></h3>
        </div>`;
        }

        function cocktailTemplate(cocktail) {
            return `<div class='cocktail-card'>
                <h3 class="cocktail-name">${cocktail.name}</h3>
                <h4 class="score">${cocktail.score}% match</h4>
                <img src="${cocktail.image}" alt="${cocktail.name}" class="cocktail-image">
                <ul class="ingredients-list">
                    ${cocktail.ingredients.map(ing => `<li>${ing}</li>`).join('')}
                </ul>
                <p class = "cocktail-instruction">${cocktail.instructions}</p>
                <a href="${cocktail.recipe_link}" target="_blank" class="recipe-link">View Recipe Online</a>
                <div class="explanation">
                    <h5>Why this drink?</h5>
                      <p> This drink was recommended because it shares ${cocktail.jaccard_score}% of its ingredients with the movie script keywords 
                        and has a script similarity score of ${cocktail.svd_score}% based on thematic content.</p>
                </div>
            </div>`;
        }

        function recipeTemplate(recipe) {
            return `<div class='recipe-card'>
                <h3 class="recipe-name">${recipe.name}</h3>
                <h4 class="score">${recipe.score}% match</h4>
                <ul class="ingredients-list">
                    ${recipe.ingredients.map(ing => `<li>${ing}</li>`).join('')}
                </ul>
                <p class = "recipe-instruction">${recipe.instructions}</p>
                <a href="${recipe.recipe_link}" target="_blank" class="recipe-link">View Recipe Online</a>
                <div class="explanation">
                    <h5>Why this recipe?</h5>
                      <p> This recipe was recommended because it shares ${recipe.jaccard_score}% of its ingredients with the movie script keywords 
                        and has a script similarity score of ${recipe.svd_score}% based on thematic content.</p>
                </div>
            </div>`;
        }

        document.addEventListener('click', function (e) {
            if (e.target && e.target.matches('.see-more')) {
                e.preventDefault();
                const card = e.target.closest('.recipe-card');
                const shortText = card.querySelector('.short-text');
                const fullText = card.querySelector('.full-text');

                shortText.classList.toggle('hidden');
                fullText.classList.toggle('hidden');
                e.target.textContent = fullText.classList.contains('hidden') ? 'See more' : 'See less';
            }
        });

        function searchMovie() {
            const movieTitle = document.getElementById("movie-search").value.trim();
            if (!movieTitle) return;

            const additionalDesc = document.getElementById("description-search").value.trim();

            const answerBox = document.getElementById("answer-box");
            const loadingIndicator = document.getElementById("loading-indicator");

            loadingIndicator.style.display = "block";
            answerBox.innerHTML = "";

            let fetchUrl = `/find-foods?movie=${encodeURIComponent(movieTitle)}`;

            if (additionalDesc) {
                fetchUrl += `&description=${encodeURIComponent(additionalDesc)}`;
            }

            fetch(fetchUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Network error');
                    return response.json();
                })
                .then(data => {
                    loadingIndicator.style.display = "none";
                    answerBox.innerHTML = "";

                    if (data.error) {
                        answerBox.innerHTML = errorTemplate(data.error);
                        return;
                    }

                    const resultsContainer = document.createElement("div");
                    resultsContainer.className = "results-container";
                    resultsContainer.innerHTML = `<h2>Results for "${movieTitle}"</h2>`;

                    // Add cocktails section
                    if (data.cocktails?.length > 0) {
                        const cocktailMain = document.createElement("div");
                        cocktailMain.className = "cocktail-main";
                        cocktailMain.innerHTML = `<h3 class="section-header">Recommended Drinks</h3>`;

                        const cocktailSection = document.createElement("div");
                        cocktailSection.className = "cocktail-section";

                        data.cocktails.forEach(c => {
                            const cocktail = c.data;
                            cocktail.score = c.score;
                            cocktail.jaccard_score = c.jaccard_score; // Ensure jaccard_score is passed
                            cocktail.svd_score = c.svd_score; // Ensure svd_score is passed
                            cocktailSection.innerHTML += cocktailTemplate(cocktail);
                        });

                        cocktailMain.appendChild(cocktailSection);
                        resultsContainer.appendChild(cocktailMain);
                    }

                    // Add recipes section
                    if (data.recipes?.length > 0) {
                        const recipeMain = document.createElement("div");
                        recipeMain.className = "recipe-main";
                        recipeMain.innerHTML = `<h3 class="section-header">Recommended Recipes</h3>`;

                        const recipeSection = document.createElement("div");
                        recipeSection.className = "recipe-section";

                        data.recipes.forEach(r => {
                            const recipe = r.data;
                            recipe.score = r.score;
                            recipe.jaccard_score = r.jaccard_score; // Ensure jaccard_score is passed
                            recipe.svd_score = r.svd_score; // Ensure svd_score is passed
                            recipeSection.innerHTML += recipeTemplate(recipe);
                        });

                        recipeMain.appendChild(recipeSection);
                        resultsContainer.appendChild(recipeMain);
                    }

                    if (resultsContainer.children.length > 1) { // 1 is the initial h2
                        answerBox.appendChild(resultsContainer);
                    } else {
                        answerBox.innerHTML = noResultsTemplate(movieTitle);
                    }
                })
                .catch(error => {
                    loadingIndicator.style.display = "none";
                    answerBox.innerHTML = errorTemplate("Failed to get results. Please try again.");
                    console.error('Error:', error);
                });
        }
    </script>
</body>
